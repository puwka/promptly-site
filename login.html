<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Promptly</title>
    <meta name="description" content="Sign in to Promptly to link your Chrome extension and manage Promptly Pro." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/login" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" data-site-header></header>
    <main class="page wrap">
      <article class="auth-card">
        <h1>Sign in</h1>
        <p class="lede">Use the same account in the browser and in the Promptly extension.</p>
        <button class="btn btn--primary btn--block" type="button" data-google>Continue with Google</button>
        <p class="auth-divider">or email</p>
        <form class="form" data-auth-form>
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />
          </div>
          <div class="btn-row">
            <button class="btn btn--primary" type="submit" data-mode="signin">Sign in</button>
            <button class="btn btn--ghost" type="submit" data-mode="signup">Create account</button>
          </div>
        </form>
        <p class="form-hint" data-auth-note></p>
      </article>
    </main>
    <footer class="footer" data-site-footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./auth.js"></script>
    <script src="./site.js"></script>
    <script>
      document.querySelector('[data-google]')?.addEventListener('click', async () => {
        const note = document.querySelector('[data-auth-note]');
        try {
          await window.PromptlyAuth.signInGoogle();
        } catch (err) {
          if (note) note.textContent = err.message || 'Google sign-in failed.';
        }
      });
      document.querySelector('[data-auth-form]')?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const note = document.querySelector('[data-auth-note]');
        const submitter = event.submitter;
        const mode = submitter?.dataset.mode || 'signin';
        const data = new FormData(event.currentTarget);
        const email = String(data.get('email') || '');
        const password = String(data.get('password') || '');
        try {
          if (mode === 'signup') {
            const result = await window.PromptlyAuth.signUpEmail(email, password);
            if (result?.session) {
              location.href = new URLSearchParams(location.search).get('next') || '/account';
              return;
            }
            if (note) note.textContent = 'Check your email to confirm the account, then sign in.';
            return;
          }
          await window.PromptlyAuth.signInEmail(email, password);
          location.href = new URLSearchParams(location.search).get('next') || '/account';
        } catch (err) {
          if (note) note.textContent = err.message || 'Could not sign in.';
        }
      });
      window.PromptlyAuth.ready.then(() => {
        if (window.PromptlyAuth.getSession()) {
          location.replace(new URLSearchParams(location.search).get('next') || '/account');
        }
      });
    </script>
  </body>
</html>
