<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Promptly</title>
    <meta name="description" content="Sign in to Promptly to link your Chrome extension and manage Promptly Pro." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/login" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" data-site-header></header>
    <main class="page wrap auth-page">
      <article class="auth-card">
        <div class="auth-card__mark" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="auth-mark" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3b5bfd"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <path fill="url(#auth-mark)" d="M32 4 38.2 25.8 60 32 38.2 38.2 32 60 25.8 38.2 4 32 25.8 25.8Z"/>
          </svg>
        </div>
        <h1>Sign in to Promptly</h1>
        <p class="lede">One account for the website and the Chrome extension.</p>

        <button class="btn btn--google btn--block" type="button" data-google>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.4 14.4A7.2 7.2 0 0 1 5 12c0-.8.1-1.6.4-2.4V6.5H1.4A12 12 0 0 0 0 12c0 1.9.5 3.8 1.4 5.5l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4A12 12 0 0 0 1.4 6.5l4 3.1C6.3 6.8 8.9 4.8 12 4.8z"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-divider"><span>or email</span></p>

        <form class="form" data-auth-form>
          <div class="form-row">
            <label for="email">Email</label>
            <div class="field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 6h16v12H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="m4 7 8 6 8-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required />
            </div>
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <div class="field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required />
            </div>
          </div>
          <button class="btn btn--primary btn--block" type="submit" data-mode="signin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
            Sign in
          </button>
          <button class="btn btn--ghost btn--block" type="submit" data-mode="signup">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6"/></svg>
            Create account
          </button>
        </form>
        <p class="form-hint" data-auth-note></p>
      </article>
    </main>
    <footer class="footer" data-site-footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./auth.js"></script>
    <script src="./site.js"></script>
    <script>
      document.querySelector('[data-google]')?.addEventListener('click', async () => {
        const note = document.querySelector('[data-auth-note]');
        try {
          await window.PromptlyAuth.signInGoogle();
        } catch (err) {
          if (note) note.textContent = err.message || 'Google sign-in failed.';
        }
      });
      document.querySelector('[data-auth-form]')?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const note = document.querySelector('[data-auth-note]');
        const submitter = event.submitter;
        const mode = submitter?.dataset.mode || 'signin';
        const data = new FormData(event.currentTarget);
        const email = String(data.get('email') || '');
        const password = String(data.get('password') || '');
        try {
          if (mode === 'signup') {
            const result = await window.PromptlyAuth.signUpEmail(email, password);
            if (result?.session) {
              location.href = window.PromptlyAuth.redirectTarget();
              return;
            }
            if (note) note.textContent = 'Check your email to confirm the account, then sign in.';
            return;
          }
          await window.PromptlyAuth.signInEmail(email, password);
          location.href = window.PromptlyAuth.redirectTarget();
        } catch (err) {
          if (note) note.textContent = err.message || 'Could not sign in.';
        }
      });
      window.PromptlyAuth.ready.then(() => {
        if (window.PromptlyAuth.getSession()) {
          location.replace(window.PromptlyAuth.redirectTarget());
        }
      });
    </script>
  </body>
</html>
